server {
    listen 80;
    server_name epizoo-demo-stand-2026.ru;

    return 301 https://epizoo-demo-stand-2026.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name epizoo-demo-stand-2026.ru;

    ssl_certificate     /etc/ssl/epizoo-demo-stand-2026/certificate.crt;
    ssl_certificate_key /etc/ssl/epizoo-demo-stand-2026/private.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3020;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API сервера (compose.prod.yaml в epizoo-server).
    location /api/ {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        gzip on;
        gzip_types application/json;

        proxy_read_timeout 60s;
    }
}
