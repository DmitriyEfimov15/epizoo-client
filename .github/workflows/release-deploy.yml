name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-and-push:
    needs: checks
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    environment: release
    env:
      REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
      REGISTRY_REPO: ${{ secrets.REGISTRY_REPO }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Compute version from tag
        id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY_URL" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      # API на том же домене: /api/ проксирует nginx хоста.
      - name: Build and push image client
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_REPO }}:${{ steps.vars.outputs.version }}
            ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Ensure deploy dir exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p "${{ secrets.DEPLOY_DIR }}"

      - name: Upload compose & configs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'compose.prod.yaml,nginx.host.conf'
          target: ${{ secrets.DEPLOY_DIR }}/

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_REPO: ${{ secrets.REGISTRY_REPO }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_DIR,VERSION,REGISTRY_URL,REGISTRY_REPO,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail

            cd "$DEPLOY_DIR"

            IMAGE="${REGISTRY_URL}/${REGISTRY_REPO}:${VERSION}"

            umask 077
            printf 'REGISTRY_URL=%s\nREGISTRY_REPO=%s\nVERSION=%s\n' \
              "$REGISTRY_URL" "$REGISTRY_REPO" "$VERSION" > .deploy.env

            echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_URL" -u "$REGISTRY_USER" --password-stdin

            compose=(docker compose --env-file .deploy.env -f compose.prod.yaml)

            echo "Pulling $IMAGE ..."
            "${compose[@]}" pull

            echo "Deploying containers..."
            "${compose[@]}" up -d --wait --wait-timeout 180 --remove-orphans

            echo "Installing Nginx config..."

            NGINX_CONF="/etc/nginx/conf.d/epizoo.conf"
            NGINX_BACKUP="$PWD/epizoo.conf.bak"

            # Прошлая версия сохраняется: битый конфиг в conf.d сломал бы
            # перезагрузку nginx для всех сайтов сервера.
            if [ -f "$NGINX_CONF" ]; then
              sudo cp "$NGINX_CONF" "$NGINX_BACKUP"
            else
              rm -f "$NGINX_BACKUP"
            fi

            sudo cp "nginx.host.conf" "$NGINX_CONF"

            echo "Testing Nginx config..."

            if sudo nginx -t; then
              echo "Reloading host Nginx..."

              sudo systemctl reload nginx

              echo "Nginx reloaded successfully"
            else
              echo "Nginx config test failed, restoring previous config"

              if [ -f "$NGINX_BACKUP" ]; then
                sudo cp "$NGINX_BACKUP" "$NGINX_CONF"
              else
                sudo rm -f "$NGINX_CONF"
              fi

              exit 1
            fi

            echo "Deployed $IMAGE successfully."

            echo "Running Clean Up..."
            docker image prune -af
            docker builder prune -af
