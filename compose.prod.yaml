name: epizoo-client

services:
  web:
    image: ${REGISTRY_URL:?}/${REGISTRY_REPO:?}:${VERSION:?}
    restart: unless-stopped
    labels:
      env: prod
      project: epizoo
    environment:
      - API_UPSTREAM=http://127.0.0.1:8000
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6
    ports:
      - '127.0.0.1:3020:80'
